name: Update latest video

# Keeps assets/latest-video.json in sync with the newest full-length
# uploads on the Rohan Learn YouTube channel (Shorts are skipped), so the
# homepage's "Latest upload" player and "Recent breakdowns" update
# themselves — no manual edit or push needed.
#
# Runs every 6 hours, can be triggered manually from the Actions tab
# right after a new video goes live, and runs once whenever this script
# or workflow is changed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/scripts/fetch-latest-video.py"
      - ".github/workflows/update-latest-video.yml"

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YouTube RSS feed for new videos
        id: fetch
        run: python3 .github/scripts/fetch-latest-video.py

      - name: Commit and push if the videos changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-video.json
          git commit -m "Auto-update latest video embed"
          git pull --rebase origin main
          git push
