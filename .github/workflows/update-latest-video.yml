name: Update latest video

# Keeps assets/latest-video.json in sync with the newest upload on the
# Rohan Learn YouTube channel, so the homepage's "Watch the newest
# breakdown" embed updates itself — no manual edit or push needed.
#
# Runs every 6 hours, plus can be triggered manually from the Actions
# tab (workflow_dispatch) right after a new video goes live.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YouTube RSS feed for a new video
        id: fetch
        run: python3 .github/scripts/fetch-latest-video.py

      - name: Commit and push if the latest video changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-video.json
          git commit -m "Auto-update latest video embed"
          git push
